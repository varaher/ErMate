<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle soft gradient / transparency -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Cross Gradient 1: Top & Left (Emerald to Cyan to Turquoise) -->
    <linearGradient id="crossGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Cross Gradient 2: Center & Right (Cyan to Ocean Blue to Purple) -->
    <linearGradient id="crossGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Cross Gradient 3: Bottom & Right Fold (Deep Blue to Royal Violet) -->
    <linearGradient id="crossGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Glossy Highlight Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="25%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>

    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#ffffff" filter="url(#logoShadow)" />

  <g transform="translate(0, -10)">
    <!-- 3D Ribbon Medical Cross Structure -->
    <!-- Left Arm -->
    <path d="M 120 180 C 120 156, 140 136, 164 136 L 206 136 L 206 180 C 206 202, 188 220, 166 220 L 120 220 Z" 
          fill="url(#crossGrad1)" />

    <!-- Top Arm -->
    <path d="M 206 136 L 206 94 C 206 70, 226 50, 250 50 C 274 50, 294 70, 294 94 L 294 180 C 294 202, 276 220, 254 220 L 206 220 Z" 
          fill="url(#crossGrad1)" />

    <!-- Center & Right Fold -->
    <path d="M 294 136 L 336 136 C 360 136, 380 156, 380 180 C 380 204, 360 224, 336 224 L 294 224 L 294 280 C 294 302, 276 320, 254 320 L 206 320 L 206 260 C 206 238, 224 220, 246 220 L 294 220 Z" 
          fill="url(#crossGrad2)" />

    <!-- Bottom Arm & Violet Curve -->
    <path d="M 206 280 L 206 336 C 206 360, 226 380, 250 380 C 274 380, 294 360, 294 336 L 294 280 Z" 
          fill="url(#crossGrad3)" />

    <!-- Full Unified Smooth Cross Silhouette with Ribbon Folds -->
    <path d="
      M 210 70 C 210 50, 226 36, 256 36 C 286 36, 302 50, 302 70 L 302 144
      L 376 144 C 396 144, 410 160, 410 190 C 410 220, 396 236, 376 236 L 302 236
      L 302 310 C 302 330, 286 344, 256 344 C 226 344, 210 330, 210 310 L 210 236
      L 136 236 C 116 236, 102 220, 102 190 C 102 160, 116 144, 136 144 L 210 144 Z
    " fill="url(#crossGrad2)" opacity="0.95" />

    <!-- Dynamic 3D Ribbon Shading -->
    <path d="
      M 210 144 C 240 144, 270 170, 270 200 C 270 230, 240 260, 210 260
      L 210 310 C 210 330, 226 344, 256 344 C 286 344, 302 330, 302 310
      L 302 236 L 376 236 C 396 236, 410 220, 410 190
      C 410 160, 396 144, 376 144 L 302 144
      C 270 144, 240 120, 240 90 L 240 70
      C 240 50, 226 36, 256 36
    " fill="url(#crossGrad3)" opacity="0.85" />

    <!-- Gloss Highlight -->
    <path d="
      M 210 70 C 210 50, 226 36, 256 36 C 270 36, 280 40, 286 48
      C 256 56, 230 84, 230 120 L 230 160
      L 150 160 C 130 160, 116 170, 108 184
      C 104 176, 102 168, 102 160 C 102 140, 116 144, 136 144 L 210 144 Z
    " fill="url(#glossGrad)" />

    <!-- Pure Crisp White ECG Heartbeat Line -->
    <path d="
      M 92 190
      L 190 190
      L 215 190
      L 230 215
      L 256 95
      L 282 255
      L 302 170
      L 322 190
      L 420 190
    " 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="18" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      filter="url(#ecgGlow)" />

    <!-- ErMate Wordmark Typography -->
    <text x="256" y="445" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="82" 
          font-weight="900" 
          text-anchor="middle"
          fill="url(#textGrad)"
          letter-spacing="-1.5">
      ErMate
    </text>
  </g>
</svg>
