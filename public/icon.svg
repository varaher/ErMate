<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <!-- Sparkle Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Drop Shadow Filter for clinical icons -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Rectangle Background (Squircle) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="12" />

  <!-- Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- 1. The Emergency Medical Cross (Centered slightly left) -->
    <path d="M 176 110 L 256 110 L 256 190 L 336 190 L 336 270 L 256 270 L 256 350 L 176 350 L 176 270 L 96 270 L 96 190 L 176 190 Z" 
          fill="#ffffff" />

    <!-- 2. The ErMate Text Accent / Scribe Shield -->
    <text x="140" y="440" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="64" 
          font-weight="900" 
          fill="#ffffff" 
          letter-spacing="1">
      ErMate
    </text>

    <!-- 3. Sparkling AI Star / Gemini Emblem (Sits on top-right of cross) -->
    <!-- Large spark -->
    <path d="M 370 120 Q 370 180 430 180 Q 370 180 370 240 Q 370 180 310 180 Q 370 180 370 120 Z" 
          fill="url(#sparkGrad)" />
          
    <!-- Small auxiliary spark -->
    <path d="M 410 90 Q 410 115 435 115 Q 410 115 410 140 Q 410 115 385 115 Q 410 115 410 90 Z" 
          fill="#ffffff" opacity="0.9" />

    <!-- Pulse/Wave indicator line under the cross representing vital monitoring -->
    <path d="M 96 300 H 130 L 142 280 L 158 330 L 174 270 L 186 310 L 194 300 H 336" 
          fill="none" 
          stroke="#a5b4fc" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.85" />
  </g>
</svg>
